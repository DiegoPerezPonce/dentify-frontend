<button
  type="button"
  class="tooth-chart"
  [class.tooth-chart--selected]="selected"
  [class.tooth-chart--corona]="!!coronaFillColor"
  (click)="onToothClick($event)"
  [attr.title]="'Diente ' + toothNumber"
>
  <svg class="tooth-chart__svg" viewBox="0 0 100 100" aria-hidden="true">
    <!-- V — vestibular (arriba) -->
    <polygon
      class="tooth-face"
      [class.tooth-face--active]="isFaceSelected('V')"
      points="10,10 90,10 65,35 35,35"
      [attr.fill]="colorFor('V')"
      (click)="onFaceClick('V', $event)"
    />
    <!-- M — mesial (izquierda) -->
    <polygon
      class="tooth-face"
      [class.tooth-face--active]="isFaceSelected('M')"
      points="10,10 35,35 35,65 10,90"
      [attr.fill]="colorFor('M')"
      (click)="onFaceClick('M', $event)"
    />
    <!-- O — oclusal/incisal (centro) -->
    <polygon
      class="tooth-face"
      [class.tooth-face--active]="isFaceSelected('O')"
      points="35,35 65,35 65,65 35,65"
      [attr.fill]="colorFor('O')"
      (click)="onFaceClick('O', $event)"
    />
    <!-- D — distal (derecha) -->
    <polygon
      class="tooth-face"
      [class.tooth-face--active]="isFaceSelected('D')"
      points="90,10 65,35 65,65 90,90"
      [attr.fill]="colorFor('D')"
      (click)="onFaceClick('D', $event)"
    />
    <!-- L — lingual/palatina (abajo) -->
    <polygon
      class="tooth-face"
      [class.tooth-face--active]="isFaceSelected('L')"
      points="10,90 35,65 65,65 90,90"
      [attr.fill]="colorFor('L')"
      (click)="onFaceClick('L', $event)"
    />
    <!-- Contorno exterior e interior -->
    <rect x="10" y="10" width="80" height="80" fill="none" stroke="currentColor" stroke-width="2" pointer-events="none" />
    <rect x="35" y="35" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" pointer-events="none" />
    <line x1="10" y1="10" x2="35" y2="35" stroke="currentColor" stroke-width="1.5" pointer-events="none" />
    <line x1="90" y1="10" x2="65" y2="35" stroke="currentColor" stroke-width="1.5" pointer-events="none" />
    <line x1="90" y1="90" x2="65" y2="65" stroke="currentColor" stroke-width="1.5" pointer-events="none" />
    <line x1="10" y1="90" x2="35" y2="65" stroke="currentColor" stroke-width="1.5" pointer-events="none" />
    @if (toothMarkColor) {
      <g class="tooth-mark" pointer-events="none" aria-hidden="true">
        <line x1="18" y1="18" x2="82" y2="82" [attr.stroke]="toothMarkColor" stroke-width="5" stroke-linecap="round" />
        <line x1="82" y1="18" x2="18" y2="82" [attr.stroke]="toothMarkColor" stroke-width="5" stroke-linecap="round" />
      </g>
    }
    @if (bridgeRingColor) {
      <circle
        class="bridge-ring"
        cx="50"
        cy="50"
        r="44"
        fill="none"
        [attr.stroke]="bridgeRingColor"
        stroke-width="3.5"
        pointer-events="none"
      />
    }
    @if (endoMarkColor) {
      <text
        class="endo-mark"
        x="50"
        y="58"
        text-anchor="middle"
        [attr.fill]="endoMarkColor"
        font-size="34"
        font-weight="700"
        pointer-events="none"
      >E</text>
    }
  </svg>
  <span class="tooth-chart__number">{{ toothNumber }}</span>
</button>
